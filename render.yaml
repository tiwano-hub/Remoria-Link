# Render Blueprint for Remoria Link
# https://render.com/docs/blueprint-spec
#
# 注意: Render 無料プランは「無料DBは1つまで」。既存の無料DBがある場合、新規DBは作れません。
# 本Blueprintは新規DBを作らず、既存の PostgreSQL を流用します。
# デプロイ後、remoria-link-api の環境変数 DATABASE_URL に、既存DBの接続URLの末尾へ
# 「?schema=remoria」を付けて設定してください（例: postgresql://...:5432/dbname?schema=remoria）。
# これにより本アプリの表は remoria スキーマに隔離され、既存データに影響しません。

services:
  - type: web
    name: remoria-link-api
    runtime: node
    rootDir: backend
    # 常時起動(コールドスタートなし)のため有料プラン。無料に戻すと約15分でスリープする。
    plan: starter
    # NODE_ENV=production だと npm が devDependencies(prisma/tsx) を省くため --include=dev を付ける
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy && npm run seed
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      # 既存DBの接続URL（末尾に ?schema=remoria を付与）を手動で設定する
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Google認証を設定するまでの初期アクセス用。メールのみで簡易ログイン可。
      # 運用開始後は false にして Google 認証へ切り替えてください。
      - key: ALLOW_SIMPLE_LOGIN
        value: "true"
      # 一時的にログインを停止する（停止したいときだけ "true" にする）
      - key: LOGIN_DISABLED
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GOOGLE_CALENDAR_CREDENTIALS
        sync: false
      # AIサポート（使い方チャット）用。Anthropic の API キーを設定すると有効化。
      - key: ANTHROPIC_API_KEY
        sync: false
      # メール送信（SMTP）。設定するとメール送信が有効化。
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # SMS送信（Twilio）。設定するとSMS送信が有効化。
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false

  - type: web
    name: remoria-link-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
