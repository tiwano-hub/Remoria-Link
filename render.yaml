# Render Blueprint for Remoria Link
# https://render.com/docs/blueprint-spec
databases:
  - name: remoria-link-db
    databaseName: remoria_link
    plan: free

services:
  - type: web
    name: remoria-link-api
    runtime: node
    rootDir: backend
    plan: free
    # NODE_ENV=production だと npm が devDependencies(prisma/tsx) を省くため --include=dev を付ける
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy && npm run seed
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: remoria-link-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Google認証を設定するまでの初期アクセス用。メールのみで簡易ログイン可。
      # 運用開始後は false にして Google 認証へ切り替えてください。
      - key: ALLOW_SIMPLE_LOGIN
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GOOGLE_CALENDAR_CREDENTIALS
        sync: false

  - type: web
    name: remoria-link-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
